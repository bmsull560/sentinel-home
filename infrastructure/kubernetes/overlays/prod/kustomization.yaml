apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinel-home

resources:
  - ../../base

namePrefix: prod-

labels:
  - pairs:
      environment: prod
    includeSelectors: true
    includeTemplates: true

replicas:
  - name: sentinel-home
    count: 3

images:
  - name: sentinel-home
    newTag: stable

patches:
  - target:
      kind: Deployment
      name: sentinel-home
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
  - target:
      kind: HorizontalPodAutoscaler
      name: sentinel-home
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

configMapGenerator:
  - name: sentinel-home-env
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info
