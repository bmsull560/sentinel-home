apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinel-home

resources:
  - ../../base

namePrefix: dev-

labels:
  - pairs:
      environment: dev
    includeSelectors: true
    includeTemplates: true

replicas:
  - name: sentinel-home
    count: 1

images:
  - name: sentinel-home
    newTag: dev

patches:
  - target:
      kind: Deployment
      name: sentinel-home
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

configMapGenerator:
  - name: sentinel-home-env
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
